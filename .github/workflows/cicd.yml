name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  build-test-deploy:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------
      # 1. CHECKOUT SOURCE CODE
      # -----------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------
      # 2. SETUP PYTHON
      # -----------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------
      # 3. INSTALL DEPENDENCIES
      # -----------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------
      # 4. RUN PYTEST
      # -----------------------------------
      - name: Run pytest
        run: |
          pytest -v

      # -----------------------------------
      # 5. CONFIGURE AWS
      # -----------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------
      # 6. LOGIN TO AMAZON ECR
      # -----------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------
      # 7. SET DOCKER IMAGE URI
      # -----------------------------------
      - name: Set Docker image
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

          IMAGE_TAG=${GITHUB_SHA}

          IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          echo "Docker Image:"
          echo "${IMAGE_URI}"

      # -----------------------------------
      # 8. BUILD DOCKER IMAGE
      # -----------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_URI \
            .

      # -----------------------------------
      # 9. PUSH IMAGE TO ECR
      # -----------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push $IMAGE_URI

      # -----------------------------------
      # 10. DEPLOY TO EC2
      # -----------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
          AWS_REGION: ${{ env.AWS_REGION }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: IMAGE_URI,AWS_REGION

          script: |

            set -e

            echo "===================================="
            echo "Logging into Amazon ECR"
            echo "===================================="

            aws ecr get-login-password \
              --region $AWS_REGION | \
              docker login \
              --username AWS \
              --password-stdin \
              $(echo $IMAGE_URI | cut -d/ -f1)

            echo "===================================="
            echo "Pulling Docker image"
            echo "===================================="

            docker pull $IMAGE_URI

            echo "===================================="
            echo "Stopping old container"
            echo "===================================="

            docker stop flask-app || true

            echo "===================================="
            echo "Removing old container"
            echo "===================================="

            docker rm flask-app || true

            echo "===================================="
            echo "Starting new Flask container"
            echo "===================================="

            docker run -d \
              --name flask-app \
              --restart unless-stopped \
              -p 4000:4000 \
              $IMAGE_URI

            echo "===================================="
            echo "Waiting for Flask application"
            echo "===================================="

            sleep 10

            echo "===================================="
            echo "Checking Flask health endpoint"
            echo "===================================="

            curl --fail \
              http://localhost:4000/health

            echo ""
            echo "===================================="
            echo "Deployment successful!"
            echo "===================================="

      # -----------------------------------
      # 11. SUCCESS NOTIFICATION
      # -----------------------------------
      - name: Success notification
        if: success()
        run: |

          echo "SUCCESS: Flask CI/CD deployment completed."

          echo "Commit: $GITHUB_SHA"

          echo "Branch: $GITHUB_REF_NAME"

          echo "Image: $IMAGE_URI"

          echo "EC2: ${{ secrets.EC2_HOST }}"

          echo "Pipeline:"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # -----------------------------------
      # 12. FAILURE NOTIFICATION
      # -----------------------------------
      - name: Failure notification
        if: failure()
        run: |

          echo "FAILURE: Flask CI/CD pipeline failed."

          echo "Commit: $GITHUB_SHA"

          echo "Branch: $GITHUB_REF_NAME"

          echo "Pipeline:"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
