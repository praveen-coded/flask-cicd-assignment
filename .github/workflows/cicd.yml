name: Flask CI/CD - Build and Push to ECR

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: flask-cicd

# ============================================================
# JOB 1 - CODE CHECK
# ============================================================

jobs:

  code-check:
    name: "1. Code Check"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Project Files
        run: |
          echo "===== Project Structure ====="
          ls -la
          echo ""
          echo "===== Workflow Files ====="
          find . -maxdepth 3 -type f

      - name: Check Python Version
        run: |
          python3 --version

      - name: Check Pip Version
        run: |
          pip3 --version

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Verify Flask Installation
        run: |
          flask --version


  # ============================================================
  # JOB 2 - UNIT TEST
  # ============================================================

  unit-test:
    name: "2. Unit Tests"
    runs-on: ubuntu-latest

    needs: code-check

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Run Pytest
        run: |
          echo "===== Running Tests ====="
          pytest -v

      - name: Test Summary
        if: always()
        run: |
          echo "===== Test Job Completed ====="


  # ============================================================
  # JOB 3 - DOCKER BUILD
  # ============================================================

  docker-build:
    name: "3. Docker Build"
    runs-on: ubuntu-latest

    needs: unit-test

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version

      - name: Check Docker Service
        run: |
          docker info

      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REPOSITORY:latest \
            .

      - name: Show Docker Images
        run: |
          docker images

      - name: Inspect Docker Image
        run: |
          docker inspect $ECR_REPOSITORY:latest


  # ============================================================
  # JOB 4 - AWS VALIDATION
  # ============================================================

  aws-check:
    name: "4. AWS Validation"
    runs-on: ubuntu-latest

    needs: docker-build

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:

      - name: Check AWS CLI
        run: |
          echo "===== AWS CLI ====="
          aws --version

      - name: Check AWS Identity
        run: |
          echo "===== AWS Identity ====="
          aws sts get-caller-identity

      - name: Check AWS Region
        run: |
          echo "===== AWS Region ====="
          echo "Region: $AWS_REGION"

      - name: Check ECR Repository
        run: |
          echo "===== Checking ECR Repository ====="

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"


  # ============================================================
  # JOB 5 - ECR LOGIN
  # ============================================================

  ecr-login:
    name: "5. ECR Login"
    runs-on: ubuntu-latest

    needs: aws-check

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:

      - name: Check AWS Identity
        run: |
          echo "===== AWS Identity ====="
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          echo "===== Logging into ECR ====="

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
            --username AWS \
            --password-stdin \
            "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Verify Docker Login
        run: |
          echo "Docker login completed successfully."


  # ============================================================
  # JOB 6 - BUILD, TAG AND PUSH
  # ============================================================

  push-to-ecr:
    name: "6. Push Image to ECR"
    runs-on: ubuntu-latest

    needs: ecr-login

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS Validation
      # --------------------------------------------------------

      - name: Check AWS Identity
        run: |
          echo "===== AWS Identity ====="
          aws sts get-caller-identity

      # --------------------------------------------------------
      # ECR Login
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        run: |
          echo "===== ECR Login ====="

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
            --username AWS \
            --password-stdin \
            "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      # --------------------------------------------------------
      # Docker Build
      # --------------------------------------------------------

      - name: Build Docker Image
        run: |
          echo "===== Building Docker Image ====="

          docker build \
            -t "$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$ECR_REPOSITORY:latest" \
            .

      # --------------------------------------------------------
      # Tag Image
      # --------------------------------------------------------

      - name: Tag Docker Image
        run: |

          ECR_URL="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "===== ECR URL ====="
          echo "$ECR_URL"

          echo "===== Tagging SHA Image ====="

          docker tag \
            "$ECR_REPOSITORY:${{ github.sha }}" \
            "$ECR_URL/$ECR_REPOSITORY:${{ github.sha }}"

          echo "===== Tagging Latest Image ====="

          docker tag \
            "$ECR_REPOSITORY:latest" \
            "$ECR_URL/$ECR_REPOSITORY:latest"

      # --------------------------------------------------------
      # Show Images
      # --------------------------------------------------------

      - name: Show Docker Images
        run: |
          echo "===== Docker Images ====="
          docker images

      # --------------------------------------------------------
      # Push SHA Image
      # --------------------------------------------------------

      - name: Push SHA Image
        run: |

          ECR_URL="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "===== Pushing SHA Image ====="

          docker push \
            "$ECR_URL/$ECR_REPOSITORY:${{ github.sha }}"

      # --------------------------------------------------------
      # Push Latest Image
      # --------------------------------------------------------

      - name: Push Latest Image
        run: |

          ECR_URL="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "===== Pushing Latest Image ====="

          docker push \
            "$ECR_URL/$ECR_REPOSITORY:latest"

      # --------------------------------------------------------
      # Verify ECR
      # --------------------------------------------------------

      - name: Verify ECR Image
        run: |

          echo "===== ECR Images ====="

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION"


  # ============================================================
  # JOB 7 - CLEANUP
  # ============================================================

  cleanup:
    name: "7. Cleanup"
    runs-on: ubuntu-latest

    if: always()

    needs:
      - code-check
      - unit-test
      - docker-build
      - aws-check
      - ecr-login
      - push-to-ecr

    steps:

      - name: Docker Cleanup
        run: |
          echo "===== Cleaning Docker Resources ====="

          docker image prune -af

      - name: Workspace Information
        run: |
          echo "===== Disk Usage ====="
          df -h

          echo ""
          echo "===== Docker Disk Usage ====="
          docker system df
